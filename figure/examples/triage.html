<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>図 依頼が届いてから記録に残るまで。規模の判断でいったん3つに分かれ、どの道を通っても記録へ合流する。</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPMincho:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/*
 * G.A Design — tokens
 *
 * 見た目の値はすべてここにある。差し替えるのはこのファイルだけで、
 * document.css は触らない。顧客ごとの skin は profiles/ に置く。
 *
 * 明暗差はすべて実測値。canvas に塗って sRGB に直し、WCAG の式で比べたもの。
 * getComputedStyle の文字列を数値として読むと嘘の値が出るので、そこから読まない。
 */

:root {
  /* 地。純白を起点にする。 */
  --gad-paper: #ffffff;
  --gad-inset: #f6f6f6; /* 要約とコードの沈んだ地 */

  /* 墨は濃い順に4段。薄く見せたいときは opacity ではなくこの段を下げる。 */
  --gad-ink: #0a0a0a; /* 白地に 19.80 / 沈んだ地に 18.32 */
  --gad-ink-muted: #5c5c5c; /*  6.69 /  6.19 */
  --gad-ink-quiet: #6e6e6e; /*  5.10 /  4.72 — 文字はここまで */
  --gad-mark: #8a8a8a; /*  3.45 — 意味を持つ線と印 */

  /* 飾りの罫。意味を持たせない。 */
  --gad-hairline: #e6e6e6;
  --gad-hairline-soft: #f0f0f0;

  /* 有彩色は2つだけ。sign は署名の飾り、alert は危険。 */
  --gad-sign: #f7e017; /* 題名の下に1本だけ引く。白地に 1.34 なので飾り専用 */
  --gad-alert: #e05a81; /* 地に 3.53、上に載せる墨で 5.61。必ず塗って言葉を添える */

  /* 書体。和文を先に置く。欧文は各書体が持つものをそのまま使う。 */
  --gad-font-body: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", system-ui, sans-serif;
  --gad-font-head: "BIZ UDPMincho", "Hiragino Mincho ProN", serif;
  --gad-font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  /*
   * 本文 18px。Zen Kaku Gothic New は漢字の実寸が 83.6(100px 指定に対して)で
   * 候補のなかで最も小さいため、17px 相当に見えるぶんを上げてある。
   */
  --gad-size-title: 34px;
  --gad-size-h2: 22px;
  --gad-size-h3: 17px;
  --gad-size-body: 18px;
  --gad-size-small: 15px;
  --gad-size-fine: 14px;
  --gad-size-label: 12px;

  --gad-weight-body: 400;
  --gad-weight-strong: 500; /* 本文の書体は 500 を持つ。太字まで飛ばさずに段を作れる */
  --gad-weight-head: 700; /* 見出しの書体は 400 と 700 だけ。600 は 700 に解決される */

  --gad-leading: 1.95;
  --gad-leading-head: 1.5;
  --gad-tracking: 0.03em;
  --gad-tracking-head: 0.05em;
  --gad-tracking-label: 0.16em;

  /* 余白。文字を敷き詰めない。 */
  --gad-gap-section: 44px;
  --gad-gap-block: 22px;
  --gad-gap-line: 14px;
  --gad-pad-page: 64px 72px 72px;
  --gad-pad-box: 22px 26px;

  /* 行長は全角34〜36字。これ以上伸ばすと目が戻れなくなる。 */
  --gad-measure: 640px;
  --gad-aside: 228px;

  /*
   * 面。本文 18px のまま投影で読ませるための大きさ。1920×1080 の画面では
   * 面の周りに余白を残して 1.88 倍に広がり、本文 34px・見出し 41px 相当で出る。
   * 1280×720 だと 1.41 倍にしかならず、本文が 25px まで落ちる。
   */
  --gad-slide-w: 960px;
  --gad-slide-h: 540px;
  --gad-slide-scale: 1; /* 面の拡大率。deck.js が画面の大きさから書き換える */

  --gad-radius: 6px;

  /* 影は持たない。奥行きは地の明るさの差と髪の毛線で出す。 */
}
/*
 * G.A Design — document
 *
 * 部品は12種。値は tokens.css からしか引かない。ここに色や寸法を直接書かない。
 * 骨格 → 12種の部品 → 印刷、の順に並べてある。
 */

/* ---------- 骨格 ---------- */

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--gad-paper);
  color: var(--gad-ink);
  font-family: var(--gad-font-body);
  font-size: var(--gad-size-body);
  font-weight: var(--gad-weight-body);
  line-height: var(--gad-leading);
  letter-spacing: var(--gad-tracking);
  -webkit-font-smoothing: antialiased;
}

.gad-page {
  max-width: calc(var(--gad-measure) + var(--gad-aside) + 200px);
  margin: 0 auto;
  padding: var(--gad-pad-page);
}

.gad-cols {
  display: flex;
  gap: 44px;
  align-items: flex-start;
}

.gad-main {
  flex-grow: 1;
  min-width: 0;
  max-width: var(--gad-measure);
}

h1 {
  font-family: var(--gad-font-head);
  font-weight: var(--gad-weight-head);
  font-size: var(--gad-size-title);
  line-height: 1.45;
  letter-spacing: 0.04em;
  margin: 0;
}

h2 {
  font-family: var(--gad-font-head);
  font-weight: var(--gad-weight-head);
  font-size: var(--gad-size-h2);
  line-height: var(--gad-leading-head);
  letter-spacing: var(--gad-tracking-head);
  margin: 0 0 16px;
}

h3 {
  font-family: var(--gad-font-head);
  font-weight: var(--gad-weight-head);
  font-size: var(--gad-size-h3);
  letter-spacing: var(--gad-tracking-head);
  margin: 0 0 10px;
}

p {
  margin: 0 0 var(--gad-gap-line);
  text-wrap: pretty;
}

section {
  margin: 0 0 var(--gad-gap-section);
}

strong {
  font-weight: var(--gad-weight-strong);
}

a {
  color: var(--gad-ink);
  text-decoration: underline;
  text-underline-offset: 3px;
  text-decoration-thickness: 1px;
}

a:hover {
  color: var(--gad-ink-muted);
}

code {
  font-family: var(--gad-font-mono);
  font-size: 0.86em;
  letter-spacing: 0;
}

/* 小さいラベル。目次や用語表の見出し、署名行に使う。 */
.gad-label {
  font-size: var(--gad-size-label);
  letter-spacing: var(--gad-tracking-label);
  color: var(--gad-ink-quiet);
}

/* ---------- 1. 署名行 ---------- */
/* 誰がいつ作ったか。紙面の上端と下端に置く。白黒印刷でも残る identity はここ。 */

.gad-signature {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 24px;
  font-size: var(--gad-size-label);
  letter-spacing: var(--gad-tracking-label);
  color: var(--gad-ink-quiet);
  padding-bottom: 10px;
  border-bottom: 1px solid var(--gad-hairline);
}

.gad-foot {
  display: flex;
  justify-content: space-between;
  gap: 24px;
  margin-top: 48px;
  padding-top: 14px;
  border-top: 1px solid var(--gad-hairline);
  font-size: var(--gad-size-label);
  letter-spacing: 0.14em;
  color: var(--gad-ink-quiet);
}

/* 題名の下に引く線。1文書に1本だけ。飾りなので意味を載せない。 */
.gad-head {
  margin: 40px 0 0;
}

.gad-rule {
  width: 72px;
  height: 5px;
  background: var(--gad-sign);
  margin: 18px 0 0;
}

.gad-lede {
  margin: 22px 0 0;
  color: var(--gad-ink-muted);
}

/* ---------- 2. 要約 ---------- */
/* 冒頭に結論を置く箱。読者が5分で決定を言い直せることが完成条件。 */

.gad-summary {
  margin: 40px 0 48px;
  padding: var(--gad-pad-box);
  background: var(--gad-inset);
  border-radius: var(--gad-radius);
}

.gad-summary > p:last-child {
  margin-bottom: 0;
}

/* ---------- 3. 目次 ---------- */

.gad-toc {
  color: var(--gad-ink-muted);
  font-size: var(--gad-size-fine);
  line-height: 2.1;
  padding: 12px 0 20px;
}

.gad-toc a {
  text-decoration: none;
}

.gad-toc a:hover {
  text-decoration: underline;
}

/* ---------- 4. 用語表 ---------- */
/* 本文の脇に置く。専門用語は本文で使う前に、ここで1〜2文で定義する。 */

.gad-aside {
  width: var(--gad-aside);
  flex-shrink: 0;
  font-size: var(--gad-size-fine);
  line-height: 1.85;
}

.gad-aside .gad-label {
  display: block;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--gad-hairline);
}

.gad-glossary {
  margin: 12px 0 0;
}

.gad-glossary dt {
  font-weight: var(--gad-weight-strong);
  margin-top: 12px;
}

.gad-glossary dd {
  margin: 2px 0 0;
  color: var(--gad-ink-muted);
}

/* ---------- 5. 引用 ---------- */
/* 原文と訳文は同じ文字サイズ・同じ色で上下に並べる。訳を格下げしない。 */

.gad-quote {
  margin: 0 0 var(--gad-gap-block);
  padding: 4px 0 4px 20px;
  border-left: 2px solid var(--gad-mark);
}

.gad-quote p {
  margin: 0 0 8px;
}

.gad-quote-source {
  font-size: var(--gad-size-fine);
  color: var(--gad-ink-quiet);
}

/* ---------- 6. コード ---------- */
/* 色は付けない。等幅と地の差だけで読ませる。 */

pre.gad-code {
  margin: 0 0 var(--gad-gap-block);
  padding: 18px 20px;
  background: var(--gad-inset);
  border-radius: var(--gad-radius);
  overflow-x: auto;
  line-height: 1.7;
}

pre.gad-code code {
  font-size: var(--gad-size-small);
}

/* ---------- 7. 表 ---------- */
/* 短い対応関係に使う。3列までを基本にする。 */

table.gad-table {
  border-collapse: collapse;
  width: 100%;
  font-size: var(--gad-size-small);
  margin: 0 0 var(--gad-gap-block);
}

.gad-table th {
  text-align: left;
  font-weight: var(--gad-weight-strong);
  color: var(--gad-ink-muted);
  padding: 8px 14px 8px 0;
  border-bottom: 1px solid var(--gad-hairline);
  white-space: nowrap;
}

.gad-table td {
  padding: 11px 14px 11px 0;
  border-bottom: 1px solid var(--gad-hairline-soft);
  vertical-align: top;
}

/* 行見出しのセル。語中で折り返させない。 */
.gad-rowlabel {
  white-space: nowrap;
  font-weight: var(--gad-weight-strong);
}

.gad-num {
  text-align: right;
  font-variant-numeric: tabular-nums;
  font-family: var(--gad-font-mono);
}

/* ---------- 8. 図の枠 ---------- */
/* 視覚資料とキャプションを1つにまとめる外枠。図形そのものではない。 */

.gad-figure {
  margin: 0 0 var(--gad-gap-block);
}

.gad-figure-frame {
  border: 1px solid var(--gad-hairline);
  border-radius: var(--gad-radius);
  padding: 24px;
  background: var(--gad-paper);
  overflow-x: auto;
}

.gad-figure figcaption {
  margin-top: 10px;
  font-size: var(--gad-size-fine);
  color: var(--gad-ink-quiet);
}

/*
 * 図の中身を描く語彙。SVG に色を直接書かせないために置いてある。
 * presentation attribute（stroke="#000" など）を使うと、そこだけ token の外に出る。
 */

.gad-figure-frame svg {
  font-family: var(--gad-font-body);
  font-size: var(--gad-size-fine);
  letter-spacing: var(--gad-tracking);
}

.gad-figure-frame svg text {
  fill: var(--gad-ink);
}

/* 箱、丸、意味を持つ線。 */
.gad-node {
  fill: none;
  stroke: var(--gad-ink);
  stroke-width: 1;
}

/* 補助線、つなぎの線。 */
.gad-link {
  fill: none;
  stroke: var(--gad-mark);
  stroke-width: 1;
}

/* 矢印の頭のような、塗る印。 */
.gad-arrow {
  fill: var(--gad-mark);
}

/* ---------- 9. 番号の付く並び ---------- */
/*
 * 順序のある並び。決まったこと・手順・受入条件のどれにも使う。
 * 理由を添えたいときだけ .gad-why を足す。決定に固有の形は持たせない。
 */

ol.gad-ordered {
  margin: 0;
  padding-left: 1.4em;
}

.gad-ordered li {
  margin-bottom: var(--gad-gap-line);
}

.gad-ordered li::marker {
  color: var(--gad-mark);
}

.gad-why {
  display: block;
  color: var(--gad-ink-muted);
}

/* ---------- 10. 未決の箱 ---------- */
/* 中身のない節は消す規則の例外。空でも「未決」と1行残す。 */

.gad-open {
  border-left: 3px solid var(--gad-hairline);
  padding: 4px 0 4px 18px;
}

.gad-open p:last-child {
  margin-bottom: 0;
}

/* ---------- 11. 注記 ---------- */
/* 補足は無彩色。注意だけ塗りつぶす。色だけで意味を伝えないよう、言葉を必ず添える。 */

.gad-note {
  padding: 14px 18px;
  background: var(--gad-inset);
  border-radius: var(--gad-radius);
  font-size: var(--gad-size-small);
  margin: 0 0 var(--gad-gap-block);
}

.gad-alert {
  padding: 14px 18px;
  background: var(--gad-alert);
  color: var(--gad-ink);
  border-radius: var(--gad-radius);
  font-size: var(--gad-size-small);
  margin: 0 0 var(--gad-gap-block);
}

.gad-note strong,
.gad-alert strong {
  font-weight: var(--gad-weight-strong);
}

/* ---------- 12. 比較の並置 ---------- */
/* 2つか3つを横に並べる。4つ以上は表にする。 */

.gad-columns {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 28px;
  margin: 0 0 var(--gad-gap-block);
}

.gad-columns-3 {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

.gad-card {
  padding: 18px 20px;
  border: 1px solid var(--gad-hairline);
  border-radius: var(--gad-radius);
}

.gad-card-title {
  font-weight: var(--gad-weight-strong);
  margin-bottom: 6px;
}

.gad-card p:last-child {
  margin-bottom: 0;
}

/* ---------- 印刷 ---------- */

@media print {
  @page {
    margin: 18mm 16mm;
  }

  body {
    font-size: 11pt;
  }

  .gad-page {
    padding: 0;
    max-width: none;
  }

  /* 脇に置いた用語表は、紙では本文の後ろへ回す。 */
  .gad-cols {
    display: block;
  }

  .gad-main {
    max-width: none;
  }

  .gad-aside {
    width: auto;
    margin-top: 32px;
    border-top: 1px solid var(--gad-hairline);
    padding-top: 16px;
  }

  /* 署名の黄色は白黒では消える。署名行の文字が identity を担う。 */
  .gad-rule {
    height: 3px;
  }

  h1,
  h2,
  h3 {
    break-after: avoid;
  }

  .gad-summary,
  .gad-note,
  .gad-alert,
  .gad-figure,
  pre.gad-code,
  .gad-card {
    break-inside: avoid;
  }

  a {
    text-decoration: none;
  }
}

/* 端末が暗い設定でも、この意匠のまま出す。暗い配色は持たない。 */
:root {
  color-scheme: light;
}
</style>
</head>
<body>
<div class="gad-page">
  <div class="gad-main">
    <!-- G.A Design 図の生成器の出力。手で直さず、入力の JSON を直して作り直す。 -->
